<!-- Sent for "Forgot password?" on the sign-in card. The card asks for this code. -->
<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #171717;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Reset your Knotly password</h2>
  <p style="margin: 0 0 16px; line-height: 1.5;">Enter this code in the Knotly chat, then choose a new password:</p>
  <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px; font-family: ui-monospace, Menlo, monospace;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; color: #525252; font-size: 14px; line-height: 1.5;">The code expires in 1 hour. If you didn't ask to reset your password, you can ignore this email; your password won't change.</p>
  <p style="margin: 24px 0 0; color: #a3a3a3; font-size: 12px;">Knotly · Wedding planning in the Carolinas</p>
</div>
